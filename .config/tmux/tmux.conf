set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'aserowy/tmux.nvim'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'uhs-robert/tmux-oasis'
set -g @plugin 'ilya-manin/tmux-spotify'

# Setup tmux theme
set -g @oasis_flavor "twilight_dark"
set -g @oasis_mode_format "full"
set -g status-position bottom

# Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Toggle tmux status bar
bind '\' set status
if-shell "[[ $(tmux lsw | wc -l) -le 1 ]]" 'set -g status'

set -g status on

# Enable mouse
set -g mouse on

# Increase history limit
set -g history-limit 30000

# Start windows and panes at 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Zero-out escape time delay for quicker response
set -s escape-time 0

# Forward terminal focus events to programs inside panes (e.g. Neovim).
# This makes Neovim receive FocusGained/FocusLost when switching tmux panes,
# so things like autoread/checktime fire instantly on pane switch.
set -g focus-events on

# Vi copy mode keybindings
set-window-option -g mode-keys vi
bind Escape copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind p paste-buffer

# keybindings
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# resizing
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Navigate tmux panes (disabled when in vim)
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# Open the new panes in the current path
bind h split-window -h -c "#{pane_current_path}" \; run-shell "~/.config/tmux/hooks/update-pane-status.sh"
bind v split-window -v -c "#{pane_current_path}" \; run-shell "~/.config/tmux/hooks/update-pane-status.sh"

# Update pane status based on number of panes
unbind x
bind x kill-pane \; run-shell "~/.config/tmux/hooks/update-pane-status.sh"
set-hook -g pane-exited 'run-shell "~/.config/tmux/hooks/update-pane-status.sh"'

# If this is your first time using tmux, you will need to press (Ctrl + Space) + I to fetch the plugins.
# Oasis theme files only set colors when they are unset, so clear previous
# colors first to make changing @oasis_flavor work after a config reload.
set -gu @thm_strong_primary
set -gu @thm_primary
set -gu @thm_light_primary
set -gu @thm_secondary
set -gu @thm_prefix
set -gu @thm_fg
set -gu @thm_core
set -gu @thm_mantle
set -gu @thm_surface
set -gu @thm_visual
set -gu @thm_red
set -gu @thm_orange
set -gu @thm_yellow
set -gu @thm_green
set -gu @thm_teal
set -gu @thm_blue
set -gu @thm_indigo
run '~/.tmux/plugins/tpm/tpm'

# Keep Oasis colors, but make pane borders visually quieter.
setw -g pane-border-style "fg=#{@thm_mantle}"
setw -g pane-active-border-style "fg=#{@thm_surface}"

# Show currently playing Spotify track before the Oasis right-side modules.
set -g status-right "#[fg=#{@thm_primary}]#(/Users/joakimedvardsen/.local/bin/tmux-spotify-info) #{E:@oasis_module_sync}#{E:@oasis_module_folder}#{E:@oasis_module_clock}"

# Other options
set -s set-clipboard on
