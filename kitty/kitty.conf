
shell /bin/zsh

# FONTS

font_size 14
font_family      family=Menlo style=Regular
bold_font        auto
italic_font      auto
bold_italic_font auto

symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

# Cursor 

cursor #cccccc
cursor_text_color #111111
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval -1
cursor_trail 10
cursor_trail_decay 0.1 0.3

# Window Layout 

remember_window_size yes
remember_window_position yes

window_padding_width 12
single_window_padding_width -1 

draw_minimal_borders yes
hide_window_decorations titlebar-only

window_border_width 1

# Tab Bar

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

# Color Scheme

foreground #dddddd
background #000000

active_border_color #fb5eef
inactive_border_color #732c6e

background_opacity 0.7
background_blur 64
background_image ~/.config/kitty/stairs.jpg
background_image_layout centered
background_tint 0.9

# Shortcuts 

kitty_mod alt
map kitty_mod+enter new_window
map kitty_mod+w close_window
map kitty_mod+n next_window
map kitty_mod+p previous_window
map kitty_mor+r start_resizing_window

map kitty_mod+k scroll_line_up
map kitty_mod+j scroll_line_down
map kitty_mod+g scroll_home
map kitty_mod+G scroll_end